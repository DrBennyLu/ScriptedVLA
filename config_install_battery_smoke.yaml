# Smoke config for ScriptedVLA + install_battery
# Runs a few training steps on episode 0 only.
#
#   bash scripts/smoke_train_install_battery.sh

model:
  vlm:
    model_name: "Qwen/Qwen2-VL-2B-Instruct"
    image_size: 224
    max_seq_length: 512
    freeze_vlm: true
    freeze_text_backbone: false
    cache_dir: "./cache/models"
    use_state: false
  action_head:
    type: "flow_matching"
    use_state: true
    hidden_dim: 1536
    num_layers: 4
    num_heads: 8
    mlp_ratio: 4.0
    action_dim: 14
    action_horizon: 10
    num_inference_timesteps: 5
    patch_size: 8
    num_patches: 196
    norm_type: "ada_norm"
    first_step_loss_weight: 0.0
  vla:
    use_cross_attention: true
    cross_attention_layers: 2
    use_state_vlm: false
    use_state_action_head: true
    future_action_window_size: 9

seed: 42

training:
  batch_size: 1
  num_epochs: 1
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 0
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8
  scheduler:
    type: "cosine"
    warmup_ratio: 0.0
    min_lr_ratio: 1.0
  save_dir: "./checkpoints/install_battery_smoke"
  save_steps: 2
  eval_steps: 2
  max_eval_batches: 1
  logging_steps: 1
  max_steps: 2
  fp16: false
  bf16: true
  lora:
    enabled: false
  init_checkpoint: null
  init_checkpoint_normalizer: false

dataset:
  local_path: "/data/share/1919650160032350208/users/lxg/datasets/install_battery"
  action_horizon: 10
  video_backend: "pyav"
  image_keys:
    - "observation.images.ego_camera"
    - "observation.images.left_wrist_camera"
    - "observation.images.right_wrist_camera"
  state_key: "observation.state.joint"
  action_dim: 14
  dataloader:
    num_workers: 0
    pin_memory: false
    shuffle: false
  task_description:
    use_batch_task: true
    use_tasks_jsonl: true
  # single episode keeps smoke fast
  episode_slice: [0]
  task_index: null
  eval_episode_id: 0

data:
  use_normalizer: true
  normalize_action: true
  normalize_state: true
  clip_normalized_state: true
  augmentation:
    enabled: false
  robot_state:
    state_dim: 16
    use_state_vlm: false
    use_state_action_head: true

inference:
  batch_size: 1
  max_new_tokens: 50

logging:
  use_wandb: false
  wandb_project: "scriptedvla-install-battery-smoke"
  use_tensorboard: false
  log_dir: "./logs/install_battery_smoke"
