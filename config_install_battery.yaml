# ScriptedVLA training config for install_battery (LeRobot v3.0)
# Dataset: /data/share/1919650160032350208/users/lxg/datasets/install_battery
#   226 eps / 171216 frames @ 30fps
#   cams: ego + left_wrist + right_wrist
#   state: observation.state.joint [16]
#   action: eef action [14]
#
# Full train:
#   source ~/miniconda3/bin/activate scriptedvla
#   export PYTHONPATH=/data/share/1919650160032350208/users/lxg/lerobot/src:$PYTHONPATH
#   cd ScriptedVLA
#   python train.py --config config_install_battery.yaml
#
# Smoke:
#   bash scripts/smoke_train_install_battery.sh

model:
  vlm:
    model_name: "Qwen/Qwen2-VL-2B-Instruct"
    image_size: 224
    max_seq_length: 512
    freeze_vlm: false
    freeze_text_backbone: false
    cache_dir: "./cache/models"
    use_state: false
  action_head:
    type: "flow_matching"
    use_state: true
    hidden_dim: 1536
    num_layers: 6
    num_heads: 12
    mlp_ratio: 4.0
    action_dim: 14
    action_horizon: 50
    num_inference_timesteps: 10
    patch_size: 8
    num_patches: 196
    norm_type: "ada_norm"
    first_step_loss_weight: 0.0
  vla:
    use_cross_attention: true
    cross_attention_layers: 3
    use_state_vlm: false
    use_state_action_head: true
    future_action_window_size: 49

seed: 42

training:
  batch_size: 16
  num_epochs: 30
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8
  scheduler:
    type: "cosine"
    warmup_ratio: 0.05
    min_lr_ratio: 0.01
  save_dir: "./checkpoints/install_battery"
  save_steps: 10000
  eval_steps: 10000
  max_eval_batches: 2
  logging_steps: 20
  max_steps: 20000
  fp16: false
  bf16: true
  lora:
    enabled: false
  init_checkpoint: null
  init_checkpoint_normalizer: true

dataset:
  local_path: "/data/share/1919650160032350208/users/lxg/datasets/install_battery"
  action_horizon: 50
  video_backend: "pyav"
  image_keys:
    - "observation.images.ego_camera"
    - "observation.images.left_wrist_camera"
    - "observation.images.right_wrist_camera"
  state_key: "observation.state.joint"
  action_dim: 14
  dataloader:
    num_workers: 2
    pin_memory: true
    shuffle: true
    prefetch_factor: 2
  task_description:
    use_batch_task: true
    use_tasks_jsonl: true
  episode_slice: null
  task_index: null
  eval_episode_id: 0

data:
  use_normalizer: true
  normalize_action: true
  normalize_state: true
  clip_normalized_state: true
  augmentation:
    enabled: false
  robot_state:
    state_dim: 16
    use_state_vlm: false
    use_state_action_head: true

inference:
  batch_size: 1
  max_new_tokens: 50

logging:
  use_wandb: false
  wandb_project: "scriptedvla-install-battery"
  use_tensorboard: false
  log_dir: "./logs/install_battery"
