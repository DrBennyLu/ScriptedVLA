# LIBERO Object 单 task posttrain 与 WebSocket 评测配置
# 用法:
#   # Stage 2 posttrain（从 pretrain 权重暖启动，推荐）:
#   uv run python train.py --config libero/config_libero_object.yaml --dataset_path ./dada/libero-object \
#     --init_checkpoint ./checkpoints/libero_object_pretrain/checkpoint_step_60000.pt
#   bash libero/scripts/train_libero_object_posttrain.sh [pretrain_ckpt_path]
#
#   # 或直接在下方 training.init_checkpoint 填写 pretrain ckpt 路径
#   uv run python train.py --config libero/config_libero_object.yaml --dataset_path ./dada/libero-object
#
#   uv run python -m libero.libero_ws_eval --config libero/config_libero_object.yaml --checkpoint-dir ./checkpoints/libero_object_task0_posttrain
#   python -m libero.libero_ws_eval_video --config libero/config_libero_object.yaml --checkpoint-dir ./checkpoints/libero_object_task0_posttrain --num-rollouts 5 --video-dir ./results/rollout_videos --camera both --chunk-steps 10
#   (--task-id 默认读取 config dataset.task_index，并按数据集 task_index 映射到 LIBERO benchmark task_id)

model:
  vlm:
    model_name: "Qwen/Qwen2-VL-2B-Instruct"
    image_size: 224
    max_seq_length: 512
    freeze_vlm: false
    freeze_text_backbone: false  # 冻结 language_model + lm_head，Vision Encoder 可训练
    cache_dir: "./cache/models"
    use_state: false
  action_head:
    type: "flow_matching"
    use_state: true
    hidden_dim: 1536
    num_layers: 6
    num_heads: 12
    mlp_ratio: 4.0
    action_dim: 7
    action_horizon: 10
    num_inference_timesteps: 10
    patch_size: 8
    num_patches: 196
    norm_type: "ada_norm"
    first_step_loss_weight: 0.0
  vla:
    use_cross_attention: true
    cross_attention_layers: 3
    use_state_vlm: false
    use_state_action_head: true
    future_action_window_size: 9

seed: 42

training:
  batch_size: 8
  num_epochs: 100
  learning_rate: 3e-5
  weight_decay: 0.01
  warmup_steps: 1000
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer:
    type: "adamw"
    betas: [0.95, 0.999]
    eps: 1e-8
  scheduler:
    type: "cosine"
    warmup_ratio: 0.05
    min_lr_ratio: 0.01
  save_dir: "./checkpoints/libero_object_full_0527_200K"
  save_steps: 100000
  eval_steps: 100000
  max_eval_batches: 1
  logging_steps: 100
  max_steps: 200000
  fp16: false
  bf16: false
  lora:
    enabled: false
  # posttrain 暖启动：设为 pretrain 最新 checkpoint；null 则从 Qwen base 随机初始化动作头
  init_checkpoint: null
  # true: 沿用 pretrain checkpoint 内 normalizer（全数据集 episodes_stats，与 pretrain 权重一致）
  # false: 按当前 dataset.task_index / episode_slice 子集重算 normalizer（需配合修复后的 subset 聚合）
  init_checkpoint_normalizer: true

dataset:
  local_path: "./dada/libero-object"
  action_horizon: 10
  image_keys:
    - "observation.images.image"
    - "observation.images.wrist_image"
  state_key: "observation.state"
  action_dim: 7
  dataloader:
    num_workers: 0
    pin_memory: false
    shuffle: true
  task_description:
    use_batch_task: true
    use_tasks_jsonl: true
  # 任务筛选：null 表示全部任务；设为 0-9 则只使用该 task_index 的 episode
  task_index: 6
  # 评估默认 episode；null 且指定 task_index 时，自动取该任务第一个 episode
  eval_episode_id: 0
  episode_slice: null

data:
  use_normalizer: true
  # LeRobot libero-object action 已是 7-dim OSC [-1,1]；训练时不应再 min-max 归一化（见 normalization.py）。
  # false = GT/模型输出均在 [-1,1]（推荐新训练）。已有 normalize_action=true 的 checkpoint 推理时请改回 true。
  normalize_action: false
  normalize_state: true
  # 仿真推理：关节角 2π 对齐到 normalizer stats，再归一化
  align_joint_angles: true
  # normalize_state 输出 clip 到 [-1,1]，防止仿真 OOD state 送入模型
  clip_normalized_state: true
  augmentation:
    enabled: false
  robot_state:
    state_dim: 8  # 6 arm joints + 2 gripper finger qpos (LeRobot libero-object convention)
    use_state_vlm: false
    use_state_action_head: true

inference:
  batch_size: 1
  max_new_tokens: 50

logging:
  use_wandb: false
  wandb_project: "vla-libero-object"
  use_tensorboard: true
  log_dir: "./logs/libero_object_task0_posttrain"

# RL token 提取器预训练（train_rl_token.py 唯一读取此块）
# 用法: uv run python train_rl_token.py
train_rl_token:
  vla_checkpoint: "./checkpoints/libero_object_full_0527_200K/checkpoint_step_200000.pt"
  # vla_checkpoint_dir: null

  dataset:
    local_path: "./dada/libero-object"
    task_index: 2
    episode_slice: null

  save_dir: "./checkpoints/libero_object_rl_token_task2"

  device: "cuda"
  seed: 42
  validate_vla_checkpoint: true

  align_dims_to_vla: true
  network:
    model_dim: null
    rl_token_dim: null  # 1536
    num_encoder_layers: 2
    num_decoder_layers: 2
    num_heads: 8
    ffn_dim: null
    dropout: 0.1

  training:
    batch_size: 8
    learning_rate: 1e-4 # 1e-5
    weight_decay: 0.0
    max_steps: 10000
    save_steps: 2000
    logging_steps: 50
    num_workers: 0

# RL TD3 离线训练（train_rl_td3.py 唯一读取此块）
# 用法: uv run python train_rl_td3.py
# WebSocket 仿真 rollout 视频（VLA + RL token + TD3）:
#   python -m libero.libero_ws_eval_td3_video --config libero/config_libero_object.yaml --task-id 6 --num-rollouts 5
train_rl_td3:
  vla_checkpoint: "./checkpoints/libero_object_full_0527_200K/checkpoint_step_200000.pt"
  rl_token_checkpoint: "./checkpoints/libero_object_rl_token_task2/rl_token_step_10000.pt"
  rl_chunk_size: 10

  dataset:
    local_path: "./dada/libero-object"
    task_index: 2
    episode_slice: null

  save_dir: "./checkpoints/libero_object_rl_td3_task2_0604"  # 兼容旧字段，等同 checkpoint.save_dir

  checkpoint:
    save_dir: "./checkpoints/libero_object_rl_td3_task2_0604"
    final_name: "td3_agent_final.pt"
    step_name_template: "td3_agent_step_{step}.pt"

  # WebSocket rollout（libero_ws_eval_td3_video.py）可选 TD3 权重
  # 优先级: --td3-checkpoint > --td3-step > eval.td3_checkpoint > eval.td3_step > final_name
  eval:
    td3_checkpoint: null
    td3_step: null

  device: "cuda"
  seed: 42
  validate_vla_checkpoint: true

  replay:
    capacity: 4000000
    stride: 2
    cache_path: "./data/replay_buffers/libero_object_task2/replay_cache.pt"
    vla_success_cache_path: "./data/replay_buffers/libero_object_task2/vla_success_replay_cache.pt"
    vla_success_sample_ratio: 0.3   # 100% 成功 0.3 ， 0.6,  90%成功 0.9
    vla_success_capacity: 500000
    rebuild_cache: false
    feature_batch_size: 8

  training:
    batch_size: 32
    num_updates: 10000
    update_ratio: 3
    logging_steps: 50
    save_steps: 2000

  td3:
    gamma: 0.99
    tau: 0.005
    actor_lr: 1.0e-4    # 离线warm up 1.0e-5
    critic_lr: 1.0e-3    # 离线warm up 4.0e-5 
    policy_noise: 0.2
    noise_clip: 0.5
    policy_delay: 2
    actor_std: 0.05
    max_action: 1.0
    ref_mask_prob: 0.5
    policy_constraint_beta: 0.3    # 0.1， 0.5

    use_chunk_return_target: true
    hidden_dims: [256, 256]

# WebSocket 在线增量TD3训练（libero_ws_online_td3.py 读取）
Online_ws_rl_training:
  # 优先读取yaml，CLI传参时覆盖
  max_train_steps: 10000
  save_every_steps: 1000
  # 每 env step 梯度次数；原 5 易导致 ~5x 离线更新量
  train_updates_per_step: 1
  replay_capacity: 20000
  buffer_dir: "./data/replay_buffers/online_ws_task6"
  buffer_max_files: 2000
  batch_size: 32
  logging_steps: 50
  td3_checkpoint: "./checkpoints/libero_object_rl_td3_task6_0602/td3_agent_step_10000.pt"
  online_checkpoint_dir: "./checkpoints/libero_object_online_ws_td3_task6_0603"
  # 与 eval 一致：确定性 rollout、不 mask ref
  rollout_deterministic: true
  rollout_apply_ref_mask: false
  # 在线微调 LR = 离线 LR * scale
  actor_lr_scale: 0.1
  critic_lr_scale: 0.1
  # 终端成功才给 reward（对齐离线 replay_cache）
  align_online_rewards: true
  # 每个 batch slot 从在线 buffer 采样的概率；失败轨迹多时建议 0.1
  online_sample_ratio: 0.1
  replay_cache_path: "./data/replay_buffers/libero_object_task6/replay_cache.pt"
  offline_replay_capacity: 40000
  vla_success_cache_path: "./data/replay_buffers/libero_object_task6/vla_success_replay_cache.pt"
  vla_success_sample_ratio: 0.2
  vla_success_capacity: 500000

# VLA 成功 rollout 采集 → TD3 replay（libero_ws_collect_vla_success_replay.py）
vla_success_replay:
  target_success_episodes: 400
  save_path: "./data/replay_buffers/libero_object_task2/vla_success_replay_cache.pt"
  progress_path: "./data/replay_buffers/libero_object_task2/vla_success_collect_progress.json"
  checkpoint_every_successes: 10
  stride: 2
  capacity: 500000
  ws_url: "ws://127.0.0.1:8765"
  max_steps: 600
  chunk_steps: 10
  task_index: 2
